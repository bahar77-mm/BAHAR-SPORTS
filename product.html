<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHAR SPORTS - Product Details</title>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #1e293b;
            --primary-color: #2563eb;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-line: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-dark);
            color: var(--text-main);
            padding: 20px 15px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-line);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* HEADER */
        .header {
            padding: 18px 20px;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-line);
        }

        .back-btn {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-body {
            padding: 20px;
        }

        /* SINGLE PRODUCT DISPLAY */
        .single-product-view {
            display: none;
        }

        .image-wrapper {
            width: 100%;
            height: 320px;
            background: #0f172a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-line);
            margin-bottom: 15px;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .product-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* MULTIPLE PRODUCTS DISPLAY CONTAINER */
        #productsListContainer {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .product-item-card {
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-line);
            align-items: center;
        }

        .product-item-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-line);
        }

        .product-item-info {
            flex: 1;
        }

        .product-item-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .product-item-price {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        /* SIZE SELECTION & QUANTITY */
        .size-section {
            margin-bottom: 25px;
        }

        .size-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 10px;
        }

        .size-label {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .size-chart-link {
            font-size: 13px;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }

        /* QUANTITY CONTROLS STYLING */
        .qty-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border-line);
        }

        .qty-btn {
            width: 38px;
            height: 38px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: #1d4ed8;
        }

        #quantityInput {
            width: 60px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            background: #0f172a;
            border: 1px solid var(--border-line);
            color: white;
            padding: 6px;
            border-radius: 8px;
            outline: none;
        }

        #dynamicSizesContainer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .size-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-line);
        }

        .size-row span {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-sub);
        }

        /* ড্রপডাউন এবং এর অপশনগুলোর জন্য ডার্ক ব্যাকগ্রাউন্ড ও সাদা লেখা নিশ্চিত করা হলো */
        .size-row select, .size-select-box select, select {
            background: #0f172a !important;
            border: 1px solid var(--border-line);
            color: #ffffff !important;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* ড্রপডাউনের ভেতরের অপশনগুলোর কালার ফিক্স */
        .size-row select option, .size-select-box select option, select option {
            background-color: #0f172a !important;
            color: #ffffff !important;
        }

        .size-select-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .size-select-box span {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }

        /* TOTAL PRICE SECTION */
        .total-summary {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            display: none;
        }

        .total-summary span {
            font-size: 16px;
            font-weight: bold;
        }

        #grandTotalPrice {
            color: var(--accent-color);
            font-size: 18px;
        }

        /* FORM SECTION */
        .form-section {
            border-top: 1px solid var(--border-line);
            padding-top: 20px;
        }

        .form-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 12px;
        }

        input, textarea {
            width: 100%;
            padding: 13px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.2);
        }

        textarea {
            height: 85px;
            resize: none;
        }

        /* BUTTON */
        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f97316, #ec4899);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.4);
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .note {
            text-align: center;
            margin-top: 12px;
            color: var(--text-sub);
            font-size: 12px;
        }

        /* MODAL (SIZE CHART) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-line);
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-sub);
        }

        .size-table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        .size-table th, .size-table td {
            border: 1px solid var(--border-line);
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }

        .size-table th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- HEADER -->
        <div class="header">
            <a href="index.html" class="back-btn">⬅️ Back</a>
            <div class="brand-title">BAHAR SPORTS</div>
        </div>

        <div class="content-body">
            <!-- 1. SINGLE PRODUCT VIEW -->
            <div id="singleProductView" class="single-product-view">
                <div class="image-wrapper">
                    <img id="productImg" src="" alt="Product">
                </div>

                <div class="product-info">
                    <h1 id="productName" class="product-title">Loading...</h1>
                    <div id="productPrice" class="product-price">৳0</div>
                </div>

                <div class="size-section">
                    <div class="size-header">
                        <span class="size-label">Select Quantity & Size</span>
                        <span class="size-chart-link" onclick="openSizeChart()">Size Guide?</span>
                    </div>

                    <!-- মডার্ন প্লাস-মাইনাস কোয়ান্টিটি কন্ট্রোল -->
                    <div class="qty-wrapper">
                        <button type="button" class="qty-btn" onclick="changeQty(-1)">-</button>
                        <input type="number" id="quantityInput" value="1" min="1" max="10" readonly>
                        <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
                    </div>

                    <div id="dynamicSizesContainer"></div>
                </div>
            </div>

            <!-- 2. MULTIPLE PRODUCTS VIEW (CART CHECKOUT) -->
            <div id="productsListContainer"></div>

            <div id="totalSummaryBox" class="total-summary">
                <span>Total Amount:</span>
                <span id="grandTotalPrice">৳0</span>
            </div>

            <!-- ORDER FORM -->
            <div class="form-section">
                <div class="form-title">📝 Enter Delivery Details</div>

                <div class="input-group">
                    <input type="text" id="name" placeholder="Your Full Name">
                </div>
                <div class="input-group">
                    <input type="tel" id="phone" placeholder="Phone Number">
                </div>
                <div class="input-group">
                    <textarea id="address" placeholder="Full Delivery Address"></textarea>
                </div>

                <button id="confirmBtn" class="submit-btn" onclick="sendOrder()">Confirm Order 🚀</button>
                <p class="note">Cash on delivery available all over Bangladesh.</p>
            </div>
        </div>
    </div>

    <!-- SIZE CHART MODAL -->
    <div id="sizeModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeSizeChart()">✖</span>
            <h3 style="text-align: center; color: var(--accent-color); margin-bottom: 10px;">Jersey Size Guide (Inches)</h3>
            <table class="size-table">
                <thead>
                    <tr>
                        <th>Size</th>
                        <th>Chest (ছাত)</th>
                        <th>Length (লম্বা)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>M</td><td>38"</td><td>27"</td></tr>
                    <tr><td>L</td><td>40"</td><td>28"</td></tr>
                    <tr><td>XL</td><td>42"</td><td>29"</td></tr>
                    <tr><td>XXL</td><td>44"</td><td>30"</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FIREBASE & EMAILJS LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyqVbz009_W67poKQgjHLuGsLQTUFHtHw",
            authDomain: "bahar-sports-f2a70.firebaseapp.com",
            projectId: "bahar-sports-f2a70",
            storageBucket: "bahar-sports-f2a70.firebasestorage.app",
            messagingSenderId: "254621686378",
            appId: "1:254621686378:web:4edfdf85c40362a51cc813"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        emailjs.init("A5cuoRzS4yFyf5f_x");

        let isMultiple = false;
        let basePrice = 0;
        let currentProduct = {};
        let cartProducts = [];
        let grandTotal = 0;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const nameParam = urlParams.get('name');
            const priceParam = urlParams.get('price');
            const imgParam = urlParams.get('img');

            if (nameParam && priceParam && imgParam) {
                let decodedNames = decodeURIComponent(nameParam);
                let decodedImgs = decodeURIComponent(imgParam);
                let totalVal = parseFloat(priceParam) || 0;

                let namesArr = decodedNames.split(',');
                let imgsArr = decodedImgs.split(',');

                // যদি একটিমাত্র প্রোডাক্ট হয় (হোমপেজ থেকে ক্লিক করা)
                if (namesArr.length === 1) {
                    isMultiple = false;
                    currentProduct = {
                        name: decodedNames.trim(),
                        price: totalVal,
                        img: decodedImgs.trim()
                    };
                    basePrice = currentProduct.price;

                    document.getElementById('singleProductView').style.display = 'block';
                    document.getElementById('productsListContainer').style.display = 'none';
                    document.getElementById('totalSummaryBox').style.display = 'none';

                    document.getElementById('productName').innerText = currentProduct.name;
                    document.getElementById('productPrice').innerText = '৳' + basePrice;
                    document.getElementById('productImg').src = currentProduct.img;

                    renderSizeSelectors();
                } 
                // যদি একাধিক প্রোডাক্ট হয় (কার্ট থেকে প্রসিড করা)
                else {
                    isMultiple = true;
                    document.getElementById('singleProductView').style.display = 'none';
                    document.getElementById('productsListContainer').style.display = 'flex';
                    document.getElementById('totalSummaryBox').style.display = 'flex';

                    let eachPrice = totalVal / namesArr.length;
                    for (let i = 0; i < namesArr.length; i++) {
                        cartProducts.push({
                            name: namesArr[i].trim(),
                            price: eachPrice,
                            img: imgsArr[i] ? imgsArr[i].trim() : imgsArr[0].trim(),
                            size: 'M'
                        });
                    }
                    renderProductsList();
                }
            } else {
                document.getElementById('singleProductView').style.display = 'block';
                document.getElementById('productName').innerText = "No Product Selected";
            }
        };

        // কোয়ান্টিটি প্লাস-মাইনাস বাটন হ্যান্ডেল করার ফাংশন
        window.changeQty = function(amount) {
            let qtyInput = document.getElementById('quantityInput');
            let currentQty = parseInt(qtyInput.value) || 1;
            let newQty = currentQty + amount;

            if (newQty >= 1 && newQty <= 10) {
                qtyInput.value = newQty;
                renderSizeSelectors();
            }
        };

        // সিঙ্গেল প্রোডাক্টের কোয়ান্টিটি অনুযায়ী সাইজ রো রেন্ডার করা
        window.renderSizeSelectors = function() {
            if (isMultiple) return;
            let qtyInput = document.getElementById('quantityInput');
            let qty = parseInt(qtyInput.value) || 1;

            let container = document.getElementById('dynamicSizesContainer');
            container.innerHTML = "";

            for (let i = 1; i <= qty; i++) {
                container.innerHTML += `
                    <div class="size-row">
                        <span>Item ${i} Size:</span>
                        <select class="item-size-choice">
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                    </div>
                `;
            }

            if (basePrice > 0) {
                let totalPrice = basePrice * qty;
                document.getElementById('productPrice').innerText = '৳' + totalPrice;
            }
        };

        // কার্টের মাল্টিপল প্রোডাক্ট লিস্ট রেন্ডার করা (নিজেদের আলাদা ছবিসহ)
        window.renderProductsList = function() {
            let container = document.getElementById('productsListContainer');
            container.innerHTML = "";

            grandTotal = 0;
            cartProducts.forEach((item, index) => {
                grandTotal += item.price;
                container.innerHTML += `
                    <div class="product-item-card">
                        <img src="${item.img}" alt="Product">
                        <div class="product-item-info">
                            <div class="product-item-title">${item.name}</div>
                            <div class="product-item-price">৳${item.price}</div>
                            <div class="size-select-box">
                                <span>Size:</span>
                                <select onchange="updateSize(${index}, this.value)">
                                    <option value="M" ${item.size === 'M' ? 'selected' : ''}>M</option>
                                    <option value="L" ${item.size === 'L' ? 'selected' : ''}>L</option>
                                    <option value="XL" ${item.size === 'XL' ? 'selected' : ''}>XL</option>
                                    <option value="XXL" ${item.size === 'XXL' ? 'selected' : ''}>XXL</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('grandTotalPrice').innerText = '৳' + grandTotal;
        };

        window.updateSize = function(index, newSize) {
            cartProducts[index].size = newSize;
        };

        window.openSizeChart = function() {
            document.getElementById('sizeModal').style.display = 'flex';
        };

        window.closeSizeChart = function() {
            document.getElementById('sizeModal').style.display = 'none';
        };

        // অর্ডার কনফার্ম ও ফায়ারবেস/ইমেইল পাঠানোর ফাংশন
        window.sendOrder = async function() {
            const btn = document.getElementById("confirmBtn");
            if (btn.disabled) return;

            let name = document.getElementById("name").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let address = document.getElementById("address").value.trim();

            if (name == "" || phone == "" || address == "") {
                alert("Please fill all information");
                return;
            }

            let finalProductStr = "";
            let sizesList = "";

            if (!isMultiple) {
                let sizeSelects = document.getElementsByClassName('item-size-choice');
                let selectedSizesList = [];
                for (let i = 0; i < sizeSelects.length; i++) {
                    selectedSizesList.push(sizeSelects[i].value);
                }
                let qty = sizeSelects.length;
                let totalPrice = basePrice * qty;
                let productName = currentProduct.name ? currentProduct.name : "N/A";
                
                finalProductStr = `${productName} (Qty: ${qty}, Total: ৳${totalPrice})`;
                sizesList = selectedSizesList.join(", ");
            } else {
                let productNamesList = cartProducts.map(item => `${item.name} (Size: ${item.size})`).join(" | ");
                sizesList = cartProducts.map(item => item.size).join(", ");
                let totalCount = cartProducts.length;
                finalProductStr = `${productNamesList} [Total Items: ${totalCount}, Total: ৳${grandTotal}]`;
            }

            btn.disabled = true;
            btn.innerHTML = "⏳ Processing...";

            try {
                await addDoc(collection(db, "orders"), {
                    name: name,
                    phone: phone,
                    product: finalProductStr,
                    size: sizesList,
                    address: address,
                    time: serverTimestamp()
                });

                await emailjs.send(
                    "service_r3cn5c2",
                    "template_2p6xf89",
                    {
                        name: name,
                        phone: phone,
                        product: finalProductStr,
                        size: sizesList,
                        address: address
                    }
                );

                alert("✅ Your Order Confirmed Successfully");
                btn.innerHTML = "✅ Order Confirmed";

                document.getElementById("name").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("address").value = "";

            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = "Confirm Order 🚀";
                alert("Order Failed: " + error.message);
            }
        };
    </script>
</body>
</html>
