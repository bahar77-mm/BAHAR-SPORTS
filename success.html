<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - BAHAR SPORTS</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #1e293b;
            --primary-color: #2563eb;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-line: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .receipt-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-line);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 30px 20px;
            text-align: center;
        }
        .success-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h2 {
            color: #22c55e;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .receipt-details {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .detail-row span:first-child {
            color: var(--text-sub);
        }
        .detail-row span:last-child {
            font-weight: bold;
            color: var(--text-main);
            text-align: right;
        }
        .home-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
        .home-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="receipt-card">
        <div class="success-icon">🎉</div>
        <h2>Order Successful!</h2>
        <p class="subtitle">Thank you for shopping with BAHAR SPORTS.</p>

        <div class="receipt-details">
            <div class="detail-row">
                <span>Customer Name:</span>
                <span id="resName">-</span>
            </div>
            <div class="detail-row">
                <span>Phone:</span>
                <span id="resPhone">-</span>
            </div>
            <div class="detail-row">
                <span>Product(s):</span>
                <span id="resProduct">-</span>
            </div>
            <div class="detail-row">
                <span>Size(s):</span>
                <span id="resSize">-</span>
            </div>
            <div class="detail-row">
                <span>Delivery Address:</span>
                <span id="resAddress">-</span>
            </div>
            <div class="detail-row" style="border-top: 1px dashed var(--border-line); padding-top: 10px; margin-top: 10px;">
                <span>Payment Info:</span>
                <span id="resPayment" style="color: var(--accent-color);">-</span>
            </div>
        </div>

        <a href="index.html" class="home-btn">Back to Home 🏠</a>
    </div>

    <script>
        // ইউআরএল থেকে অর্ডারের ডেটাগুলো রিসিভ করে রসিদে বসানো
        const params = new URLSearchParams(window.location.search);
        document.getElementById('resName').innerText = params.get('name') || 'N/A';
        document.getElementById('resPhone').innerText = params.get('phone') || 'N/A';
        document.getElementById('resProduct').innerText = params.get('product') || 'N/A';
        document.getElementById('resSize').innerText = params.get('size') || 'N/A';
        document.getElementById('resAddress').innerText = params.get('address') || 'N/A';
        document.getElementById('resPayment').innerText = params.get('payment') || 'Cash on Delivery';
    </script>
</body>
</html>
