<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - BAHAR SPORTS</title>
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: rgb(255, 255, 255);
            --primary-color: #ffffff;
            --accent-color: #f8fafc;
            --text-main: #f8fafc;
            --text-sub: #ffffff;
            --border-line: rgb(0, 0, 0);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #40afff 0%, #ffffff 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* STADIUM FLOODLIGHT ATMOSPHERE OVERLAY */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.25), transparent 45%),
                radial-gradient(circle at 85% 10%, rgba(248, 250, 252, 0.2), transparent 45%),
                radial-gradient(circle at 50% 90%, rgb(97, 89, 89), transparent 55%);
            pointer-events: none;
            z-index: 1;
        }

        .receipt-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--border-line);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .success-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h2 {
            color: #09043f;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .receipt-details {
            background: rgb(0, 0, 0);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .detail-row span:first-child {
            color: var(--text-sub);
        }
        .detail-row span:last-child {
            font-weight: bold;
            color: var(--text-main);
            text-align: right;
        }
        .tracking-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        .tracking-label {
            color: var(--text-sub);
            font-size: 13px;
            margin-bottom: 7px;
        }

        .tracking-code {
            color: #ffffff;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 7px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .tracking-note {
            color: var(--text-sub);
            font-size: 12px;
            margin-bottom: 12px;
        }

        .track-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #01041d;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .track-btn:hover { background: #03011c; }

        .home-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #0b0f19;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }
        .home-btn:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="receipt-card">
        <div class="success-icon">🎉</div>
        <h2>Order Successful!</h2>
        <p class="subtitle">Thank you for shopping with BAHAR SPORTS.</p>

        <div class="receipt-details">
            <div class="detail-row">
                <span>Customer Name:</span>
                <span id="resName">-</span>
            </div>
            <div class="detail-row">
                <span>Phone:</span>
                <span id="resPhone">-</span>
            </div>
            <div class="detail-row">
                <span>Product(s):</span>
                <span id="resProduct">-</span>
            </div>
            <div class="detail-row">
                <span>Size(s):</span>
                <span id="resSize">-</span>
            </div>
            <div class="detail-row">
                <span>Delivery Address:</span>
                <span id="resAddress">-</span>
            </div>
            <div class="detail-row" style="border-top: 1px dashed var(--border-line); padding-top: 10px; margin-top: 10px;">
                <span>Payment Info:</span>
                <span id="resPayment" style="color: var(--accent-color);">-</span>
            </div>
        </div>

        <div class="tracking-box">
            <div class="tracking-label">YOUR ORDER TRACKING CODE</div>
            <div class="tracking-code" id="resOrderId">-</div>
            <div class="tracking-note">Save this code to track your order later.</div>
            <a href="tracking.html" id="trackBtn" class="track-btn">📦 Track My Order</a>
        </div>

        <a href="index.html" class="home-btn">Back to Home 🏠</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('resName').innerText = params.get('name') || 'N/A';
        document.getElementById('resPhone').innerText = params.get('phone') || 'N/A';
        document.getElementById('resProduct').innerText = params.get('product') || 'N/A';
        document.getElementById('resSize').innerText = params.get('size') || 'N/A';
        document.getElementById('resAddress').innerText = params.get('address') || 'N/A';
        document.getElementById('resPayment').innerText = params.get('payment') || 'Cash on Delivery';

        const orderId = params.get('orderId') || 'N/A';
        document.getElementById('resOrderId').innerText = orderId;

        if (orderId !== 'N/A') {
            document.getElementById('trackBtn').href =
                'tracking.html?id=' + encodeURIComponent(orderId);
        }
    </script>
</body>
</html>
