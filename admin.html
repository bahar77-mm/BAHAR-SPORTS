<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAHAR SPORTS Admin Panel</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#2563eb);
    padding:20px;
}
.box{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}
h1, h2{
    text-align:center;
    color:#1e293b;
    margin-bottom:20px;
}
.login input, .upload-section input, .upload-section select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:30px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}
button:hover {
    opacity:0.9;
}
#dashboard, .section-content{
    display:none;
}
.admin-menu {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
}
.menu-btn {
    flex: 1;
    padding: 20px;
    font-size: 18px;
    background: #0f172a;
    border-radius: 15px;
    transition: 0.3s;
}
.menu-btn:hover {
    background: #2563eb;
}
.back-btn {
    background: #64748b;
    width: auto;
    padding: 8px 20px;
    font-size: 14px;
    margin-bottom: 15px;
    border-radius: 8px;
}
.upload-section {
    background:#f8fafc;
    padding:20px;
    border-radius:15px;
    border:1px solid #e2e8f0;
}
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}
th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}
th{
    background:#2563eb;
    color:white;
}

/* CONFIRM BUTTON STYLE FOR TABLE */
.table-confirm-btn {
    background: #22c55e;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    width: auto;
    margin-top: 0;
}
.table-confirm-btn:hover {
    background: #16a34a;
}

/* মোবাইল ফ্রেন্ডলি রেসপন্সিভ ডিজাইন (সিএসএস এর একদম শেষে বসাতে হবে) */
@media(max-width: 768px) {
    body {
        padding: 10px;
    }
    
    .box {
        padding: 15px;
        border-radius: 12px;
    }

    h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 18px;
    }

    .admin-menu {
        flex-direction: column;
        gap: 10px;
    }

    .menu-btn {
        width: 100%;
        padding: 15px;
        font-size: 16px;
    }

    .login input, .upload-section input, .upload-section select, button {
        font-size: 14px;
        padding: 10px;
    }

    table {
        display: block;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        font-size: 12px;
    }

    th, td {
        padding: 8px 10px;
    }
}
</style>
</head>
<body>
<div class="box">
    <h1>BAHAR SPORTS Admin Panel</h1>

    <!-- Login Box -->
    <div class="login" id="loginBox">
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn">Login</button>
    </div>

    <!-- Dashboard Menu -->
    <div id="dashboard">
        <h2>Welcome Admin</h2>
        <div class="admin-menu">
            <button class="menu-btn" onclick="showSection('orderSection')">📦 Order Details</button>
            <button class="menu-btn" onclick="showSection('uploadSection')">🛍️ Upload Product</button>
        </div>
    </div>

    <!-- Upload Product Section -->
    <div id="uploadSection" class="section-content">
        <button class="back-btn" onclick="goBack()">⬅️ Back to Menu</button>
        <div class="upload-section">
            <h2>🛍️ Upload New Product</h2>
            <input type="text" id="prodName" placeholder="Product Name (e.g. Argentina Jersey)">
            <input type="number" id="prodPrice" placeholder="Price (e.g. 750)">
            <select id="prodCategory">
                <option value="Jersey">Jersey</option>
                <option value="Boots">Boots</option>
                <option value="Accessories">Accessories</option>
            </select>
            <input type="text" id="prodImg" placeholder="Image URL (ImgBB / Direct Link)">
            <button id="uploadBtn">Upload Product 🚀</button>
        </div>
    </div>

    <!-- Order List Section -->
    <div id="orderSection" class="section-content">
        <button class="back-btn" onclick="goBack()">⬅️ Back to Menu</button>
        <h2>All Orders Details</h2>
        <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Product</th>
            <th>Size</th>
            <th>Address</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="orderList">
        </tbody>
        </table>
    </div>
</div>

<script>
    function showSection(sectionId) {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('uploadSection').style.display = 'none';
        document.getElementById('orderSection').style.display = 'none';
        
        document.getElementById(sectionId).style.display = 'block';
    }

    function goBack() {
        document.getElementById('uploadSection').style.display = 'none';
        document.getElementById('orderSection').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
    }
</script>

<script type="module" src="admin.js"></script>
</body>
</html>
