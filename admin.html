<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROXY Admin Panel</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
body{
    min-height:100vh;
    background:linear-gradient(135deg,#050b14,#0284c7);
    padding:20px;
    color: #f0f9ff;
}
.box{
    max-width:1100px;
    margin:auto;
    background:rgba(13, 27, 42, 0.9);
    backdrop-filter: blur(12px);
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    border: 1px solid rgba(56, 189, 248, 0.3);
}
h1, h2{
    text-align:center;
    color:#38bdf8;
    margin-bottom:20px;
}
.login input, .upload-section input, .upload-section select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid rgba(56, 189, 248, 0.3);
    background: #0b192c;
    color: #f0f9ff;
    font-size:16px;
}
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:30px;
    background:#0284c7;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
    transition: 0.3s;
}
button:hover {
    background: #38bdf8;
    color: #030712;
}
#dashboard, .section-content{
    display:none;
}
.admin-menu {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
}
.menu-btn {
    flex: 1;
    min-width: 200px;
    padding: 20px;
    font-size: 18px;
    background: #0b192c;
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 15px;
    transition: 0.3s;
}
.menu-btn:hover {
    background: #0284c7;
    color: white;
}
.back-btn {
    background: #64748b;
    width: auto;
    padding: 8px 20px;
    font-size: 14px;
    margin-bottom: 15px;
    border-radius: 8px;
}
.upload-section {
    background:rgba(11, 25, 44, 0.6);
    padding:20px;
    border-radius:15px;
    border:1px solid rgba(56, 189, 248, 0.2);
}
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}
th,td{
    padding:12px;
    border:1px solid rgba(56, 189, 248, 0.2);
    text-align:center;
    font-size: 14px;
    color: #f0f9ff;
}
th{
    background:#0284c7;
    color:white;
}

/* TABLE INPUT & BUTTON STYLES */
.table-input {
    width: 90px;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    background: #0b192c;
    color: #f0f9ff;
    text-align: center;
}
.table-confirm-btn {
    background: #22c55e;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    width: auto;
    margin-top: 0;
}
.table-confirm-btn:hover {
    background: #16a34a;
}
.table-delete-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    width: auto;
    margin-top: 0;
}
.table-delete-btn:hover {
    background: #dc2626;
}

@media(max-width: 768px) {
    body { padding: 10px; }
    .box { padding: 15px; border-radius: 12px; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    .admin-menu { flex-direction: column; gap: 10px; }
    .menu-btn { width: 100%; padding: 15px; font-size: 16px; }
    .login input, .upload-section input, .upload-section select, button { font-size: 14px; padding: 10px; }
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; font-size: 12px; }
    th, td { padding: 8px 10px; }
}
</style>
</head>
<body>
<div class="box">
    <h1>ROXY Admin Panel</h1>

    <!-- Login Box -->
    <div class="login" id="loginBox">
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn">Login</button>
    </div>

    <!-- Dashboard Menu -->
    <div id="dashboard">
        <h2>Welcome Admin</h2>
        <div class="admin-menu">
            <button class="menu-btn" onclick="showSection('orderSection')">📦 Order Details</button>
            <button class="menu-btn" onclick="showSection('uploadSection')">🛍️ Upload Product</button>
            <button class="menu-btn" onclick="showSection('manageProductSection')">⚙️ Manage Products & Stock</button>
        </div>
    </div>

    <!-- Upload Product Section -->
    <div id="uploadSection" class="section-content">
        <button class="back-btn" onclick="goBack()">⬅️ Back to Menu</button>
        <div class="upload-section">
            <h2>🛍️ Upload New Product</h2>
            <input type="text" id="prodName" placeholder="Product Name (e.g. Stylish Shirt)">
            <input type="number" id="prodPrice" placeholder="Regular Price (e.g. 750)">
            <input type="number" id="prodDiscountPrice" placeholder="Discount Price (Optional e.g. 600)">
            
            <!-- Category Selection updated to Shirt, PANT, T SHIRT -->
            <select id="prodCategory">
                <option value="Shirt">Shirt</option>
                <option value="PANT">PANT</option>
                <option value="T SHIRT">T SHIRT</option>
            </select>
            
            <select id="prodStockStatus">
                <option value="In Stock">In Stock (স্টকে আছে)</option>
                <option value="Stock Out">Stock Out (সম্পূর্ণ স্টক আউট)</option>
            </select>
            <input type="text" id="prodImg" placeholder="Image URL (ImgBB / Direct Link)">
            <button id="uploadBtn">Upload Product 🚀</button>
        </div>
    </div>

    <!-- Manage Products & Stock Section -->
    <div id="manageProductSection" class="section-content">
        <button class="back-btn" onclick="goBack()">⬅️ Back to Menu</button>
        <h2>Manage Existing Products & Stock</h2>
        <table>
        <thead>
        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Regular Price</th>
            <th>Discount Price</th>
            <th>Stock Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="manageProductList">
        <!-- JS diye product load hobe -->
        </tbody>
        </table>
    </div>

    <!-- Order List Section -->
    <div id="orderSection" class="section-content">
        <button class="back-btn" onclick="goBack()">⬅️ Back to Menu</button>
        <h2>All Orders Details</h2>
        <table>
        <thead>
        <tr>
            <th>Tracking Code</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Product</th>
            <th>Size</th>
            <th>Address</th>
            <th>Payment Info</th>
            <th>Order Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="orderList">
        </tbody>
        </table>
    </div>
</div>

<script>
    function showSection(sectionId) {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('uploadSection').style.display = 'none';
        document.getElementById('orderSection').style.display = 'none';
        document.getElementById('manageProductSection').style.display = 'none';
        document.getElementById(sectionId).style.display = 'block';
    }

    function goBack() {
        document.getElementById('uploadSection').style.display = 'none';
        document.getElementById('orderSection').style.display = 'none';
        document.getElementById('manageProductSection').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
    }
</script>

<script type="module" src="admin.js"></script>
</body>
</html>
