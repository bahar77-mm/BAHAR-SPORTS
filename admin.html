<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAHAR SPORTS Admin Panel</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#2563eb);
    padding:20px;
}
.box{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}
h1, h2{
    text-align:center;
    color:#1e293b;
    margin-bottom:20px;
}
.login input, .upload-section input, .upload-section select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:30px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}
button:hover {
    opacity:0.9;
}
#dashboard, .section-content{
    display:none;
}
.admin-menu {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
}
.menu-btn {
    flex: 1;
    min-width: 200px;
    padding: 20px;
    font-size: 18px;
    background: #0f172a;
    border-radius: 15px;
    transition: 0.3s;
}
.menu-btn:hover {
    background: #2563eb;
}
.back-btn {
    background: #64748b;
    width: auto;
    padding: 8px 20px;
    font-size: 14px;
    margin-bottom: 15px;
    border-radius: 8px;
}
.upload-section {
    background:#f8fafc;
    padding:20px;
    border-radius:15px;
    border:1px solid #e2e8f0;
}
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}
th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
    font-size: 14px;
}
th{
    background:#2563eb;
    color:white;
}

/* CONFIRM BUTTON STYLE FOR TABLE */
.table-confirm-btn {
    background: #22c55e;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    width: auto;
    margin-top: 0;
}
.table-confirm-btn:hover {
    background: #16a34a;
}

/* মোবাইল ফ্রেন্ডলি রেসপন্সিভ ডিজাইন */
@media(max-width: 768px) {
    body {
        padding: 10px;
    }
    
    .box {
        padding: 15px;
        border-radius: 12px;
    }

    h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 18px;
    }

    .admin-menu {
        flex-direction: column;
        gap: 10px;
    }

    .menu-btn {
        width: 100%;
        padding: 15px;
        font-size: 16px;
    }

    .login input, .upload-section input, .upload-section select, button {
        font-size: 14px;
        padding: 10px;
    }

    table {
        display: block;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        font-size: 12px;
    }

    th, td {
        padding: 8px 10px;
    }
}
</style>
</head>
<body>
<div class="box">
    <h1>BAHAR SPORTS Admin Panel</h1>

    <!-- Login Box -->
    <div class="login" id="loginBox">
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn">Login</button>
    </div>

    <!-- Dashboard Menu -->
    <div id="dashboard">
        <h2>Welcome Admin</h2>
        <div class="admin-menu">
            <button class="menu-btn" onclick="showSection('orderSection')">📦 Order Details</button>
            <button class="menu-btn" onclick="showSection('uploadSection')">🛍️ Upload Product</button>
            <button class="menu-btn" onclick="showSection('manageProductSection')">⚙️ Manage Products & Stock</button>
        </div>
    </div>

    <!-- Upload Product Section -->
    <div id="uploadSection" class="section-content">
        <button class="back-btn" onclick="goBack()">⬅️ Back to Menu</button>
        <div class="upload-section">
            <h2>🛍️ Upload New Product</h2>
            <input type="text" id="prodName" placeholder="Product Name (e.g. Argentina Jersey)">
            <input type="number" id="prodPrice" placeholder="Price (e.g. 750)">
            <select id="prodCategory">
                <option value="Jersey">Jersey</option>
                <option value="Boots">Boots</option>
                <option value="Accessories">Accessories</option>
            </select>
            <!-- স্টক স্ট্যাটাস কন্ট্রোল ড্রপডাউন -->
            <select id="prodStockStatus">
                <option value="In Stock">In Stock (স্টকে আছে)</option>
                <option value="Stock Out">Stock Out (সম্পূর্ণ স্টক আউট)</option>
                <option value="M Size Stock Out">M Size Stock Out (এম সাইজ স্টক আউট)</option>
                <option value="L Size Stock Out">L Size Stock Out (এল সাইজ স্টক আউট)</option>
                <option value="XL Size Stock Out">XL Size Stock Out (এক্সএল সাইজ স্টক আউট)</option>
                <option value="XXL Size Stock Out">XXL Size Stock Out (ডাবল এক্সএল সাইজ স্টক আউট)</option>
                <option value="3XL Size Stock Out">3XL Size Stock Out (ট্রিপল এক্সএল সাইজ স্টক আউট)</option>
            </select>
            <!-- ডিসকাউন্ট পার্সেন্টেজ ইনপুট ফিল্ড -->
            <input type="number" id="prodDiscount" placeholder="Discount Percentage (e.g. 10 for 10%)" value="0">
            
            <input type="text" id="prodImg" placeholder="Image URL (ImgBB / Direct Link)">
            <button id="uploadBtn">Upload Product 🚀</button>
        </div>
    </div>

    <!-- Manage Products & Stock Section -->
    <div id="manageProductSection" class="section-content">
        <button class="back-btn" onclick="goBack()">⬅️ Back to Menu</button>
        <h2>Manage Existing Products, Discount & Stock</h2>
        <table>
        <thead>
        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Discount (%)</th>
            <th>Stock Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="manageProductList">
        <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে আগের প্রোডাক্টগুলোর তালিকা ও ডিসকাউন্ট অপশন লোড হবে -->
        </tbody>
        </table>
    </div>

    <!-- Order List Section -->
    <div id="orderSection" class="section-content">
        <button class="back-btn" onclick="goBack()">⬅️ Back to Menu</button>
        <h2>All Orders Details</h2>
        <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Product</th>
            <th>Size</th>
            <th>Address</th>
            <th>Payment Info</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="orderList">
        </tbody>
        </table>
    </div>
</div>

<script>
    function showSection(sectionId) {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('uploadSection').style.display = 'none';
        document.getElementById('orderSection').style.display = 'none';
        document.getElementById('manageProductSection').style.display = 'none';
        
        document.getElementById(sectionId).style.display = 'block';
    }

    function goBack() {
        document.getElementById('uploadSection').style.display = 'none';
        document.getElementById('orderSection').style.display = 'none';
        document.getElementById('manageProductSection').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
    }
</script>

<!-- ফায়ারবেজ এবং অ্যাডমিন লজিক স্ক্রিপ্ট -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        getDocs, 
        addDoc, 
        deleteDoc, 
        doc, 
        updateDoc, 
        query, 
        orderBy 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCyqVbz009_W67poKQgjHLuGsLQTUFHtHw",
        authDomain: "bahar-sports-f2a70.firebaseapp.com",
        projectId: "bahar-sports-f2a70",
        storageBucket: "bahar-sports-f2a70.firebasestorage.app",
        messagingSenderId: "254621686378",
        appId: "1:254621686378:web:4edfdf85c40362a51cc813"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Login Logic
    document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        signInWithEmailAndPassword(auth, email, password)
            .then(() => {
                alert("Login Successful!");
            })
            .catch((error) => {
                alert("Login Failed: " + error.message);
            });
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadOrders();
            loadManageProducts();
        } else {
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }
    });

    // Upload New Product with Discount
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const name = document.getElementById('prodName').value.trim();
        const price = Number(document.getElementById('prodPrice').value);
        const category = document.getElementById('prodCategory').value;
        const stockStatus = document.getElementById('prodStockStatus').value;
        const discount = Number(document.getElementById('prodDiscount').value) || 0;
        const img = document.getElementById('prodImg').value.trim();

        if (!name || !price || !img) {
            alert("Please fill in all required fields!");
            return;
        }

        try {
            await addDoc(collection(db, "products"), {
                name: name,
                price: price,
                category: category,
                stockStatus: stockStatus,
                discount: discount,
                img: img,
                createdAt: new Date()
            });
            alert("Product uploaded successfully!");
            document.getElementById('prodName').value = "";
            document.getElementById('prodPrice').value = "";
            document.getElementById('prodDiscount').value = "0";
            document.getElementById('prodImg').value = "";
            loadManageProducts();
        } catch (error) {
            alert("Error uploading product: " + error.message);
        }
    });

    // Load Orders List
    async function loadOrders() {
        const orderList = document.getElementById('orderList');
        orderList.innerHTML = "";
        try {
            const q = query(collection(db, "orders"), orderBy("time", "desc"));
            const querySnapshot = await getDocs(q);
            querySnapshot.forEach((documentSnap) => {
                let data = documentSnap.data();
                orderList.innerHTML += `
                    <tr>
                        <td>${data.name || ''}</td>
                        <td>${data.phone || ''}</td>
                        <td>${data.product || ''}</td>
                        <td>${data.size || ''}</td>
                        <td>${data.address || ''}</td>
                        <td>${data.payment || ''}</td>
                        <td><button class="table-confirm-btn" onclick="deleteOrder('${documentSnap.id}')">Delete</button></td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error("Error loading orders: ", e);
        }
    }

    window.deleteOrder = async function(id) {
        if (confirm("Are you sure you want to delete this order?")) {
            try {
                await deleteDoc(doc(db, "orders", id));
                loadOrders();
            } catch (e) {
                alert("Error deleting order: " + e.message);
            }
        }
    }

    // Load Existing Products for Management & Updating Discount/Stock
    async function loadManageProducts() {
        const manageList = document.getElementById('manageProductList');
        manageList.innerHTML = "";
        try {
            const querySnapshot = await getDocs(collection(db, "products"));
            querySnapshot.forEach((documentSnap) => {
                let data = documentSnap.data();
                let productId = documentSnap.id;
                let currentDiscount = data.discount !== undefined ? data.discount : 0;
                let currentStock = data.stockStatus || "In Stock";

                manageList.innerHTML += `
                    <tr>
                        <td><img src="${data.img}" width="50" height="50" style="object-fit:cover; border-radius:6px;"></td>
                        <td><b>${data.name}</b></td>
                        <td>৳${data.price}</td>
                        <td>
                            <input type="number" id="disc_${productId}" value="${currentDiscount}" style="width:70px; padding:5px; text-align:center;">
                        </td>
                        <td>
                            <select id="stock_${productId}" style="padding:5px;">
                                <option value="In Stock" ${currentStock === "In Stock" ? "selected" : ""}>In Stock</option>
                                <option value="Stock Out" ${currentStock === "Stock Out" ? "selected" : ""}>Stock Out</option>
                                <option value="M Size Stock Out" ${currentStock === "M Size Stock Out" ? "selected" : ""}>M Size Stock Out</option>
                                <option value="L Size Stock Out" ${currentStock === "L Size Stock Out" ? "selected" : ""}>L Size Stock Out</option>
                                <option value="XL Size Stock Out" ${currentStock === "XL Size Stock Out" ? "selected" : ""}>XL Size Stock Out</option>
                                <option value="XXL Size Stock Out" ${currentStock === "XXL Size Stock Out" ? "selected" : ""}>XXL Size Stock Out</option>
                                <option value="3XL Size Stock Out" ${currentStock === "3XL Size Stock Out" ? "selected" : ""}>3XL Size Stock Out</option>
                            </select>
                        </td>
                        <td>
                            <button class="table-confirm-btn" onclick="updateProduct('${productId}')" style="margin-bottom:5px;">Update</button>
                            <button class="table-confirm-btn" style="background:#ef4444;" onclick="deleteProduct('${productId}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error("Error loading products: ", e);
        }
    }

    // Update Product Discount & Stock Status
    window.updateProduct = async function(id) {
        const newDiscount = Number(document.getElementById(`disc_${id}`).value) || 0;
        const newStock = document.getElementById(`stock_${id}`).value;

        try {
            const productRef = doc(db, "products", id);
            await updateDoc(productRef, {
                discount: newDiscount,
                stockStatus: newStock
            });
            alert("Product updated successfully with new discount and stock!");
            loadManageProducts();
        } catch (e) {
            alert("Error updating product: " + e.message);
        }
    }

    // Delete Product
    window.deleteProduct = async function(id) {
        if (confirm("Are you sure you want to delete this product?")) {
            try {
                await deleteDoc(doc(db, "products", id));
                loadManageProducts();
            } catch (e) {
                alert("Error deleting product: " + e.message);
            }
        }
    }
</script>
</body>
</html>
