<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAHAR SPORTS Admin Panel</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#2563eb);
    padding:20px;
}
.box{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}
h1, h2{
    text-align:center;
    color:#1e293b;
    margin-bottom:20px;
}
.login input, .upload-section input, .upload-section select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:30px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}
button:hover {
    opacity:0.9;
}
#dashboard{
    display:none;
}
.upload-section {
    background:#f8fafc;
    padding:20px;
    border-radius:15px;
    border:1px solid #e2e8f0;
    margin-bottom:30px;
}
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}
th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}
th{
    background:#2563eb;
    color:white;
}
@media(max-width:700px){
    table{
        font-size:12px;
    }
}
</style>
</head>
<body>
<div class="box">
    <h1>BAHAR SPORTS Admin Panel</h1>

    <!-- Login Box -->
    <div class="login" id="loginBox">
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn">Login</button>
    </div>

    <!-- Dashboard Box -->
    <div id="dashboard">
        <!-- Upload Section -->
        <div class="upload-section">
            <h2>🛍️ Upload New Product</h2>
            <input type="text" id="prodName" placeholder="Product Name (e.g. Argentina Jersey)">
            <input type="number" id="prodPrice" placeholder="Price (e.g. 750)">
            <select id="prodCategory">
                <option value="Jersey">Jersey</option>
                <option value="Boots">Boots</option>
                <option value="Accessories">Accessories</option>
            </select>
            <input type="text" id="prodImg" placeholder="Image URL (ImgBB / Direct Link)">
            <button id="uploadBtn">Upload Product 🚀</button>
        </div>

        <!-- Order List Section -->
        <h2>All Orders</h2>
        <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Product</th>
            <th>Size</th>
            <th>Address</th>
        </tr>
        </thead>
        <tbody id="orderList">
        </tbody>
        </table>
    </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
