<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHAR SPORTS - Login / Register</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #1e293b;
            --primary-color: #2563eb;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-line: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-dark);
            color: var(--text-main);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-line);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            padding: 30px 25px;
        }

        .header-title {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f97316, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.4);
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .toggle-text span {
            color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
        }

        .back-home:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div id="formTitle" class="header-title">Customer Login</div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button id="actionBtn" class="submit-btn" onclick="handleAuth()">Login 🚀</button>

        <div class="toggle-text">
            <span id="toggleMsg">Don't have an account? Register here</span>
        </div>

        <a href="index.html" class="back-home">⬅️ Back to Home</a>
    </div>

    <!-- FIREBASE AUTH SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyqVbz009_W67poKQgjHLuGsLQTUFHtHw",
            authDomain: "bahar-sports-f2a70.firebaseapp.com",
            projectId: "bahar-sports-f2a70",
            storageBucket: "bahar-sports-f2a70.firebasestorage.app",
            messagingSenderId: "254621686378",
            appId: "1:254621686378:web:4edfdf85c40362a51cc813"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isRegisterMode = false;

        window.toggleMode = function() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById("formTitle");
            const btn = document.getElementById("actionBtn");
            const toggleMsg = document.getElementById("toggleMsg");

            if (isRegisterMode) {
                title.innerText = "Create Account";
                btn.innerText = "Register 📝";
                toggleMsg.innerText = "Already have an account? Login here";
            } else {
                title.innerText = "Customer Login";
                btn.innerText = "Login 🚀";
                toggleMsg.innerText = "Don't have an account? Register here";
            }
        }

        document.getElementById("toggleMsg").onclick = toggleMode;

        window.handleAuth = async function() {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();

            if (!email || !password) {
                alert("Please fill in both email and password.");
                return;
            }

            try {
                if (isRegisterMode) {
                    // Sign Up
                    await createUserWithEmailAndPassword(auth, email, password);
                    
                    // জিমেইল থেকে নাম আলাদা করে লোকাল স্টোরেজে সেভ করা
                    let customerName = email.split('@')[0];
                    localStorage.setItem('loggedInUser', customerName);

                    alert("Registration successful! You are now logged in.");
                    window.location.href = "index.html";
                } else {
                    // Sign In
                    await signInWithEmailAndPassword(auth, email, password);
                    
                    // জিমেইল থেকে নাম আলাদা করে লোকাল স্টোরেজে সেভ করা
                    let customerName = email.split('@')[0];
                    localStorage.setItem('loggedInUser', customerName);

                    alert("Login successful!");
                    window.location.href = "index.html";
                }
            } catch (error) {
                alert("Error: " + error.message);
            }
        };
    </script>
</body>
    
</html>
